services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auto_calls
      POSTGRES_PASSWORD: auto_calls
      POSTGRES_DB: auto_calls
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_calls -d auto_calls"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://auto_calls:auto_calls@db:5432/auto_calls
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/srv/app/app
      - ./alembic:/srv/app/alembic

volumes:
  db_data:
